<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-card">
    <section class="brand-panel">
        <img th:src="@{/img/puc-minas.jpg}" alt="PUC Minas">
    </section>
    <section class="form-panel">
        <div class="form-content">
            <h1>Recuperar senha</h1>
            <p class="subtitle">Digite seu e-mail para receber o código de verificação.</p>
            <p class="message error" th:if="${erro}" th:text="${erro}"></p>
            <form th:action="@{/enviar-codigo}" method="post">
                <div class="field">
                    <label for="email">E-mail cadastrado</label>
                    <input id="email" type="email" name="email" placeholder="Digite seu e-mail" required autofocus>
                </div>
                <button class="primary-button" type="submit">Enviar código</button>
            </form>
            <div class="links">
                <a th:href="@{/login}">Voltar para o login</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
