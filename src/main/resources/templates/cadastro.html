<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro</title>
</head>
<body>
    <h2>Cadastro de Usuário</h2>
    <p style="color: red;" th:if="${erro}" th:text="${erro}"></p>
    
    <form action="/cadastrar" method="post" th:object="${usuario}">
        <label>Nome:</label>
        <input type="text" th:field="*{nome}" required/><br/><br/>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required/><br/><br/>
        <label>Senha:</label>
        <input type="password" th:field="*{senha}" required/><br/><br/>
        <button type="submit">Cadastrar</button>
    </form>
    <br/>
    <a href="/login">Voltar ao Login</a>
</body>
</html>
