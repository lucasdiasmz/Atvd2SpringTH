<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar código | PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-card">
    <section class="brand-panel">
        <img th:src="@{/img/puc-minas.jpg}" alt="PUC Minas">
    </section>
    <section class="form-panel">
        <div class="form-content">
            <h1>Verifique seu e-mail</h1>
            <p class="subtitle">Informe o código de 6 dígitos enviado para o seu e-mail.</p>
            <p class="message error" th:if="${erro}" th:text="${erro}"></p>
            <p class="message success" th:if="${sucesso}" th:text="${sucesso}"></p>
            <form th:action="@{/verificar-codigo}" method="post">
                <input type="hidden" name="email" th:value="${email}">
                <div class="field">
                    <label for="codigo">Código de verificação</label>
                    <input class="code-input" id="codigo" type="text" name="codigo"
                           inputmode="numeric" maxlength="6" pattern="[0-9]{6}"
                           placeholder="000000" required autofocus>
                </div>
                <button class="primary-button" type="submit">Confirmar código</button>
            </form>
            <div class="links">
                <a th:href="@{/esqueci-senha}">Enviar para outro e-mail</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
