<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-card">
    <section class="brand-panel">
        <img th:src="@{/img/puc-minas.jpg}" alt="PUC Minas">
    </section>
    <section class="form-panel">
        <div class="form-content">
            <h1>Login</h1>
            <p class="subtitle">Entre com seus dados para acessar o sistema.</p>
            <p class="message error" th:if="${erro}" th:text="${erro}"></p>
            <p class="message success" th:if="${sucesso}" th:text="${sucesso}"></p>
            <form th:action="@{/logar}" method="post">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" name="email" placeholder="Digite seu e-mail" required autofocus>
                </div>
                <div class="field">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" name="senha" placeholder="Digite sua senha" required>
                </div>
                <button class="primary-button" type="submit">Entrar</button>
            </form>
            <div class="links">
                <p>Ainda não tem cadastro?</p>
                <a th:href="@{/cadastro}">Cadastre-se</a>
                <span> | </span>
                <a class="accent" th:href="@{/esqueci-senha}">Esqueceu sua senha?</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
